{{- define "poly.v3.configmap" -}}
{{- $app := $.currentApp -}}
{{- range $cm := $app.configMaps }}
{{- if $cm.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm.fullName | default (printf "%s-%s" $.Release.Name $cm.name) }}
  labels: {{- include "poly.v3.labels" $ | nindent 4 }}
{{- with $cm.data }}
data:
  {{- if $cm.isFileType -}}
  {{ range $key, $val := $cm.data }}
  {{ $key }}: |-
{{ $val | indent 4 -}}
  {{ end }}
  {{- else -}}
  {{ toYaml $cm.data | nindent 2 }}
  {{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
