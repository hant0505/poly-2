{{- define "poly.v3.hpa" }}
{{- $app := $.currentApp -}}
{{- $hpa := $app.autoscaling -}}
{{- if and (and $app.enabled $hpa.enabled) (mustHas $app.deployType (list "Deployment" "StatefulSet")) }}
---
apiVersion: {{ include "poly.v3.hpa.apiVersion" $ }}
kind: HorizontalPodAutoscaler
metadata: {{- include "poly.v3.commonMetadata" $ | nindent 2 }}
spec:
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  scaleTargetRef:
  {{- if $app.rollout.enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
  {{- else }}
    apiVersion: apps/v1
    kind: {{ $app.deployType }}
  {{- end }}
    name: {{ include "poly.v3.fullname" $ }}
  {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.Version }}
  behavior:
    scaleDown: {{- include "poly.v3.hpa.scalingRule" $hpa.behavior.scaleDown | nindent 6 }}
    scaleUp: {{- include "poly.v3.hpa.scalingRule" $hpa.behavior.scaleUp | nindent 6 }}
  {{- end }}
  {{- /* [CHANGED 4]: was 2 separate identical metrics blocks (memory & cpu), now 1 range loop */}}
  metrics:
    {{- range $metric := list (list "memory" $hpa.targetMemoryUtilizationPercentage) (list "cpu" $hpa.targetCPUUtilizationPercentage) }}
    - type: Resource
      resource:
        name: {{ index $metric 0 }}
        {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.Version }}
        target:
          type: Utilization
          averageUtilization: {{ index $metric 1 }}
        {{- else }}
        targetAverageUtilization: {{ index $metric 1 }}
        {{- end }}
    {{- end }}
{{- end -}}
{{- end -}}
