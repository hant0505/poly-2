{{/*
[NEW FILE] Render a resource, then once more for each item in its "extra" list.
Replaces the "set currentX / include / range extraX" block that main.yaml repeated 5 times.
Params: ctx (root context), field (field of currentApp to set), main (base config),
        extras (list of extra configs), tpl (name of the template to include)
*/}}
{{- define "poly.v3.renderWithExtras" -}}
{{- $root := get . "ctx" -}}
{{- $field := get . "field" -}}       
{{- $tpl := get . "tpl" -}} 
{{- $_ := set $root.currentApp $field (get . "main") -}}
{{- include $tpl $root -}}
{{- range $extra := get . "extras" }}
{{- $_ := set $root.currentApp $field $extra -}}
{{- include $tpl $root -}}
{{- end -}}
{{- end -}}