{{- range $appName, $appConfig := .Values }}
{{- if $appConfig.enabled -}}
{{- $appName := kebabcase $appName -}}
{{- if not (mustHas $appName (list "default" "apps" "defaultApp")) -}}
{{- $_ := set $appConfig "name" $appName -}}
{{- $_ := set $ "currentApp" (mustMergeOverwrite (deepCopy $.Values.default) $appConfig) -}}

{{- /* Deployment resources */}}
{{- if eq $.currentApp.deployType "Deployment" -}}
{{- include "poly.v3.deployment" $ }}
{{- else if eq $.currentApp.deployType "StatefulSet" -}}
{{- include "poly.v3.statefulset" $ }}
{{- else if eq $.currentApp.deployType "DaemonSet" -}}
{{- include "poly.v3.daemonset" $ }}
{{- else if eq $.currentApp.deployType "CronJob" -}}
{{- include "poly.v3.cronjob" $ }}
{{- else if eq $.currentApp.deployType "Job" -}}
{{- include "poly.v3.job" $ }}
{{- end }}

{{- /* Service resources */}}
{{- /* [CHANGED] was: set currentSvc + include + range extraServices (5 lines) */ -}}
{{- include "poly.v3.renderWithExtras" (dict "ctx" $ "field" "currentSvc" "main" $.currentApp.service "extras" $.currentApp.service.extraServices "tpl" "poly.v3.service") -}}

{{- /* SA resources */}}
{{- include "poly.v3.sa" $ -}}

{{- /* Ingress resources */}}
{{- /* [CHANGED] was: set currentIngress + include + range extraIngresses */ -}}
{{- include "poly.v3.renderWithExtras" (dict "ctx" $ "field" "currentIngress" "main" $.currentApp.ingress "extras" $.currentApp.ingress.extraIngresses "tpl" "poly.v3.ingress") -}}

{{- /* ConfigMap resources */}}
{{- include "poly.v3.configmap" $ -}}
{{- if eq $.currentApp.vault.template.type "configmap" -}}
{{- include "poly.v3.vault.configmap" $ -}}
{{- end -}}

{{- /* PVC resources */}}
{{- include "poly.v3.pvc" $ }}

{{- /* HPA resources */}}
{{- include "poly.v3.hpa" $ }}

{{- /* ServiceMonitor resources */}}
{{- include "poly.v3.servicemonitor" $ }}

{{- /* Rollout resources */}}
{{- include "poly.v3.rollout" $ }}

{{- /* PodDisruptionBudget resources */}}
{{- if ne $.currentApp.deployType "StatefulSet" -}}
{{- /* [CHANGED] was: set currentPdb + include + range extraPdb */ -}}
{{- include "poly.v3.renderWithExtras" (dict "ctx" $ "field" "currentPdb" "main" $.currentApp.pdb "extras" $.currentApp.pdb.extraPdb "tpl" "poly.v3.pdb") -}}
{{- end -}}

{{- /* Istio VirtualService resources */}}
{{- /* [CHANGED] was: set currentVS + include + range extraVS */ -}}
{{- include "poly.v3.renderWithExtras" (dict "ctx" $ "field" "currentVS" "main" $.currentApp.istio.virtualservice "extras" $.currentApp.istio.virtualservice.extraVS "tpl" "poly.v3.virtualservice") -}}

{{- /* Istio Gateway resources */}}
{{- /* [CHANGED] was: set currentGateway + include + range extraGW */ -}}
{{- include "poly.v3.renderWithExtras" (dict "ctx" $ "field" "currentGateway" "main" $.currentApp.istio.gateway "extras" $.currentApp.istio.gateway.extraGW "tpl" "poly.v3.gateway") -}}

{{- /* Rollout dynamic configmap */}}
{{- end -}}
{{- end -}}
{{- end -}}
